<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PermitDecoder | Premium Compliance Intelligence</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --surface: #ffffff;
      --background: #f8fafc;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--background);
      color: var(--primary);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Noise Texture Overlay */
    .bg-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.02;
      z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Google Translate Styling */
    #google_translate_element {
      min-height: 40px;
      display: inline-flex !important;
      align-items: center;
    }
    .goog-te-gadget {
      font-family: inherit !important;
      color: transparent !important;
      font-size: 0 !important;
    }
    .goog-te-gadget .goog-te-combo {
      padding: 6px 12px !important;
      border: 1.5px solid #e2e8f0 !important;
      border-radius: 10px !important;
      background: white !important;
      font-weight: 700 !important;
      font-size: 12px !important;
      color: #334155 !important;
      outline: none !important;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .goog-te-gadget .goog-te-combo:hover {
      border-color: #2563eb;
    }
    .goog-logo-link, .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
    body { top: 0 !important; }
    .skiptranslate { display: inline-flex !important; }

    /* Print Styles: Professional PDF Export */
    @media print {
      @page { size: auto; margin: 15mm; }
      body { background: white !important; font-family: "Instrument Sans", sans-serif; color: black !important; }
      .print-hide { display: none !important; }
      #root { overflow: visible !important; height: auto !important; }
      .report-card { 
        box-shadow: none !important; 
        border: 1px solid #eee !important; 
        border-radius: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }
      .prose { max-width: 100% !important; color: black !important; font-size: 11pt !important; }
      h1, h2, h3 { page-break-after: avoid; color: black !important; }
      table { width: 100% !important; border-collapse: collapse !important; border: 1px solid #ddd !important; }
      th, td { border: 1px solid #ddd !important; padding: 8px !important; text-align: left !important; }
    }

    /* Interactive Elements */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    .hover-lift {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hover-lift:hover {
      transform: translateY(-4px);
    }

    .goog-tooltip { display: none !important; }
    .goog-tooltip:hover { display: none !important; }
    .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
  </style>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?deps=react@18.2.0,react-dom@18.2.0",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0?deps=react@18.2.0,react-dom@18.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div class="bg-noise"></div>
  <div id="root"></div>

</body>
</html>
